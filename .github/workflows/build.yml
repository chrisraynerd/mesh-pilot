name: Firmware build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Check scroll gestures
        run: |
          c++ -std=c++11 -I src tests/scroll_gestures.cpp -o /tmp/mesh-pilot-scroll-check
          /tmp/mesh-pilot-scroll-check
      - name: Check bot triggers and rate limits
        run: |
          c++ -std=c++11 -I src tests/bot_rules.cpp -o /tmp/mesh-pilot-bot-check
          /tmp/mesh-pilot-bot-check
      - name: Build E32R28T firmware
        run: pio run
      - name: Save firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-pilot-e32r28t
          path: |
            .pio/build/e32r28t/firmware.bin
            .pio/build/e32r28t/bootloader.bin
            .pio/build/e32r28t/partitions.bin
